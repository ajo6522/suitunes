name: Windows prototype
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --target Suitunes_VST3 SuitunesTests PitchPopRegression PitchPopDiagnostics --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: PitchPop-Windows-x64
          path: build/Suitunes_artefacts/Release/VST3/Pitch Pop.vst3
